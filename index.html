<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="The Ada Foundation works with the people of Ada, Ghana, for education, health, clean water, livelihoods and a protected coast.">
<title>Ada Foundation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: river-to-sea flow. A wide estuary hero, then sections that alternate lagoon-dark and salt-light bands, like tide lines. */
:root{
  --salt:#F4F7F6;        /* page ground: Songor salt flats */
  --surface:#FFFFFF;
  --ink:#0C2A30;         /* deep lagoon */
  --muted:#4D6A70;
  --line:#D5E2E1;
  --river:#0B7F86;       /* Volta teal, primary accent */
  --river-ink:#FFFFFF;
  --sun:#E5A632;         /* evening sun on the estuary, used sparingly */
  --band:#0C2A30;        /* dark band background */
  --band-fg:#E8F1F0;
  --band-muted:#9DBBBD;
  --display:"Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --body:"Instrument Sans", "Helvetica Neue", Arial, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --salt:#081B1F; --surface:#0E262B; --ink:#E6F0EF; --muted:#9AB5B7; --line:#1E3E44;
    --river:#3FC1C6; --river-ink:#04272B; --sun:#F0B94C;
    --band:#041215; --band-fg:#E6F0EF; --band-muted:#86A6A9;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --salt:#081B1F; --surface:#0E262B; --ink:#E6F0EF; --muted:#9AB5B7; --line:#1E3E44;
  --river:#3FC1C6; --river-ink:#04272B; --sun:#F0B94C;
  --band:#041215; --band-fg:#E6F0EF; --band-muted:#86A6A9;
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--salt);color:var(--ink);font:400 17px/1.6 var(--body);-webkit-font-smoothing:antialiased}
.wrap{max-width:1160px;margin-inline:auto;padding-inline:clamp(16px,4vw,40px)}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:6px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--river)}
.band .eyebrow{color:var(--sun)}

/* Nav */
header.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--salt) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:14px}
.brand{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--display);text-decoration:none}
.brand svg{flex:none}
.nav ul{display:flex;gap:24px;list-style:none;margin:0;padding:0;font-weight:500;font-size:15px}
.nav ul a{text-decoration:none;color:var(--muted)}
.nav ul a:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;font:600 15px/1 var(--body);padding:13px 20px;border-radius:999px;text-decoration:none;transition:transform .15s ease, background .15s ease}
.btn:hover{transform:translateY(-1px)}
.btn-primary{background:var(--river);color:var(--river-ink)}
.btn-ghost{background:transparent;color:inherit;box-shadow:inset 0 0 0 1.5px currentColor}
@media (max-width:820px){.nav ul{display:none}}

/* Hero */
.hero{position:relative;overflow:hidden;padding-block:clamp(56px,9vw,112px) 0}
.hero-grid{display:grid;grid-template-columns:1.35fr 1fr;gap:clamp(24px,5vw,64px);align-items:end}
.hero h1{font-size:clamp(44px,7.4vw,96px);font-weight:800}
.hero h1 em{font-style:normal;color:var(--river)}
.hero .lede{margin-top:24px;font-size:clamp(17px,1.6vw,20px);color:var(--muted);max-width:52ch}
.hero .ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.coords{font:500 13px/1.7 var(--mono);color:var(--muted);border-left:2px solid var(--sun);padding-left:16px}
.coords strong{color:var(--ink);font-weight:500}
.estuary{display:block;width:100%;height:auto;margin-top:clamp(40px,6vw,72px)}
.estuary .w1{animation:drift 14s ease-in-out infinite alternate}
.estuary .w2{animation:drift 18s ease-in-out infinite alternate-reverse}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-60px)}}
@media (max-width:820px){.hero-grid{grid-template-columns:1fr}}

/* Dark band */
.band{background:var(--band);color:var(--band-fg)}
section{padding-block:clamp(64px,9vw,112px)}
.sec-head{display:grid;grid-template-columns:1fr 1.2fr;gap:24px 48px;align-items:end;margin-bottom:48px}
.sec-head h2{font-size:clamp(32px,4.4vw,54px);font-weight:700;margin-top:14px}
.sec-head p{color:var(--muted);max-width:56ch}
.band .sec-head p{color:var(--band-muted)}
@media (max-width:820px){.sec-head{grid-template-columns:1fr}}

/* About */
.about-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:color-mix(in srgb,var(--band-fg) 14%,transparent);border-radius:var(--r);overflow:hidden}
.fact{background:var(--band);padding:28px;display:flex;flex-direction:column;gap:10px;min-width:0}
.fact h3{font-size:22px;font-weight:700}
.fact p{color:var(--band-muted);font-size:16px}
.fact .k{font:500 12px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
@media (max-width:820px){.about-grid{grid-template-columns:1fr}}

/* Programs */
.programs{display:grid;grid-template-columns:repeat(6,1fr);gap:20px}
.prog{grid-column:span 2;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:28px;display:flex;flex-direction:column;gap:14px;min-width:0;transition:border-color .2s ease}
.prog:hover{border-color:var(--river)}
.prog.wide{grid-column:span 3}
.prog .icon{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;background:color-mix(in srgb,var(--river) 14%,transparent);color:var(--river)}
.prog h3{font-size:24px;font-weight:700}
.prog p{color:var(--muted);font-size:16px}
.prog ul{margin:auto 0 0;padding:14px 0 0;list-style:none;border-top:1px dashed var(--line);display:grid;gap:6px;font-size:15px}
.prog li{display:flex;gap:10px}
.prog li::before{content:"";flex:none;width:6px;height:6px;margin-top:9px;border-radius:50%;background:var(--sun)}
@media (max-width:960px){.prog,.prog.wide{grid-column:span 3}}
@media (max-width:640px){.programs{grid-template-columns:1fr}.prog,.prog.wide{grid-column:auto}}

/* Goals */
.goals{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.goal{border-top:2px solid var(--river);padding-top:18px;display:flex;flex-direction:column;gap:6px}
.goal .n{font:800 clamp(40px,5vw,60px)/1 var(--display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.goal .u{color:var(--muted);font-size:15px}
.note{margin-top:20px;font:500 12px/1.5 var(--mono);color:var(--muted)}
@media (max-width:820px){.goals{grid-template-columns:repeat(2,1fr)}}

/* Donate */
.donate{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,5vw,64px);align-items:start}
.donate h2{font-size:clamp(32px,4.4vw,54px);font-weight:700;margin-top:14px}
.donate .copy p{color:var(--band-muted);margin-top:18px;max-width:48ch}
.panel{background:var(--surface);color:var(--ink);border-radius:20px;padding:clamp(20px,3vw,32px);display:grid;gap:18px}
.seg{display:flex;padding:4px;background:var(--salt);border-radius:999px;border:1px solid var(--line)}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font:600 14px/1 var(--body);padding:11px;border-radius:999px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--salt)}
.amounts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.amounts button{border:1.5px solid var(--line);background:transparent;color:var(--ink);border-radius:12px;padding:14px 6px;font:700 18px/1 var(--display);cursor:pointer;font-variant-numeric:tabular-nums}
.amounts button[aria-pressed="true"]{border-color:var(--river);background:color-mix(in srgb,var(--river) 12%,transparent)}
.impact{font-size:15px;color:var(--muted);min-height:3.2em;padding:14px 16px;background:var(--salt);border-radius:12px}
.impact strong{color:var(--ink)}
@media (max-width:820px){.donate{grid-template-columns:1fr}}
@media (max-width:420px){.amounts{grid-template-columns:repeat(2,1fr)}}

/* Volunteer form */
.vol{display:grid;grid-template-columns:1fr 1.1fr;gap:clamp(24px,5vw,64px)}
.vol h2{font-size:clamp(32px,4.4vw,54px);font-weight:700;margin-top:14px}
.vol .copy p{color:var(--muted);margin-top:18px;max-width:48ch}
form{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.field{display:grid;gap:6px;min-width:0}
.field.full{grid-column:1/-1}
label{font-size:14px;font-weight:600}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;width:100%}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--river)}
textarea{min-height:110px;resize:vertical}
.status{grid-column:1/-1;padding:14px 16px;border-radius:12px;background:color-mix(in srgb,var(--river) 12%,transparent);font-size:15px}
@media (max-width:820px){.vol{grid-template-columns:1fr}}
@media (max-width:520px){form{grid-template-columns:1fr}}

/* Footer */
footer{background:var(--band);color:var(--band-muted);padding-block:56px 40px;font-size:15px}
footer .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
footer h4{font:500 12px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--sun);margin:0 0 14px}
footer .brand{color:var(--band-fg)}
footer ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
footer a{text-decoration:none}
footer a:hover{color:var(--band-fg)}
.fine{margin-top:40px;padding-top:20px;border-top:1px solid color-mix(in srgb,var(--band-fg) 14%,transparent);display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;font-size:13px}
@media (max-width:720px){footer .cols{grid-template-columns:1fr}}
</style>

</head>
<body>
</body>
</html>
